name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install build dependencies
        run: npm install --no-audit --no-fund
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build and verify pages
        env:
          PUBLIC_ORIGIN: ${{ steps.pages.outputs.base_url }}
          GOOGLE_BOOKING_URL: ${{ vars.GOOGLE_BOOKING_URL || 'https://calendar.app.google/sKCVgdHbJ9b6D5NN6' }}
          FORMSPREE_FORM_ID: ${{ vars.FORMSPREE_FORM_ID }}
        run: |
          test -n "$PUBLIC_ORIGIN"
          npm test
      - name: Upload generated site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
